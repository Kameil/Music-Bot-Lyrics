name: Pylint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Basic project check (import test)
        run: |
          echo "Creating temporary config package for import test..."
          mkdir -p config
          cat << EOF > config/__init__.py
          token = "fake_token_for_ci_only"
          last_fm_application_name = "fake_application_name"
          last_fm_API_key = "fake_api_key_1234567890"
          last_fm_shared_secret = "fake_shared_secret_abcdef"
          Registered_to = "CI Test Bot"
          EOF
          echo "Verifying that the bot starts without import errors..."
          python -c "import main"

      - name: Analyse code with pylint
        run: |
          echo "Running pylint - job will fail if global score is below 8.0/10..."
          pylint $(git ls-files '*.py') --fail-under=8.0