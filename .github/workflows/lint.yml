name: Pylint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pylint:
    name: Pylint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Create temporary config for CI
        run: |
          mkdir -p config
          printf '%s\n' \
            'TOKEN = "fake_token_for_ci_only"' \
            'LAST_FM_APPLICATION_NAME = "fake_application_name"' \
            'LAST_FM_API_KEY = "fake_api_key_1234567890"' \
            'LAST_FM_SHARED_SECRET = "fake_shared_secret_abcdef"' \
            'REGISTERED_TO = "CI Test Bot"' \
            > config/__init__.py

      - name: Basic import test
        run: |
          echo "Testing basic imports..."
          python -c "import main"

      - name: Run pylint
        run: |
          echo "Running pylint (minimum score: 8.0)..."
          python -m pylint $(git ls-files '*.py') --fail-under=8.0
